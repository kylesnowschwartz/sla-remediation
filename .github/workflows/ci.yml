name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bundle exec rake test
      - run: bundle exec rake lint
      - name: No credential fragments in the tree
        run: test -z "$(git grep -n 'cog[_]')"
